name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - master # 如果你的默认分支是 main，请保持；如果是 master，请改为 master
  workflow_dispatch: # 允许你在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取全部历史，Quartz 需要用于生成 git 时间戳

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Quartz v5 建议使用 Node 22 或更高（如 24），v4 也兼容

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build
        # 如果你使用的是 Quartz v5，可能需要改为：
        # run: npx quartz plugin install && npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
